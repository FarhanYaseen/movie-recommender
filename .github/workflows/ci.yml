name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  node-api:
    name: Legacy Node API — lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  python-api:
    name: FastAPI backend — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movie_recommender_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movie_recommender_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movie_recommender_test
      JWT_SECRET: ci-test-secret
      # Provider keys intentionally absent: CI never makes paid API calls.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Show database env as Python sees it
        run: python -c "import os; print({k: ('set' if os.environ.get(k) else 'MISSING') for k in ('DATABASE_URL', 'TEST_DATABASE_URL')})"
      - name: Run tests
        run: python -m pytest -q
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movie_recommender_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movie_recommender_test

  web:
    name: Next.js frontend — typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
